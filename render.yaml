services:
  - type: web
    name: granbike-face-builder
    env: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/health
    disk:
      name: team-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: TMP_DIR
        value: /tmp/granbike-face-builder
      - key: TEAM_DATA_DIR
        value: /var/data
      - key: JAVA_PATH
        value: java
      - key: ADMIN_PASSWORD
        sync: false
      # Optional, only needed if you want PRG generation on Render.
      # Put a private zip URL containing the Connect IQ SDK folder.
      - key: CONNECTIQ_SDK_ZIP_URL
        sync: false
      # Optional, only needed if you want PRG generation on Render.
      # Base64 of developer_key.der.
      - key: DEVELOPER_KEY_DER_BASE64
        sync: false
